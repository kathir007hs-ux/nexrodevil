<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NEXORA | Admin Login</title>

    <link rel="stylesheet"
          href="admin-login.css">

</head>

<body>


    <!-- ADMIN LOGIN -->

    <main class="admin-login-container">


        <div class="admin-login-card">


            <!-- BRAND -->

            <div class="admin-brand">

                <div class="logo">
                    NEX<span>ORA</span>
                </div>

                <div class="admin-badge">
                    ADMIN CONTROL
                </div>

            </div>


            <!-- HEADER -->

            <div class="admin-header">

                <p>
                    SECURE ADMIN ACCESS
                </p>

                <h1>
                    CONTROL
                    <span>CENTER</span>
                </h1>

                <div class="status">

                    <span class="status-dot"></span>

                    SYSTEM ONLINE

                </div>

            </div>


            <!-- LOGIN FORM -->

            <form id="adminLoginForm">


                <div class="input-group">

                    <label for="adminEmail">
                        ADMIN EMAIL
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="Enter admin email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="adminPassword">
                        ADMIN PASSWORD
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter admin password"
                        required
                    >

                </div>


                <button type="submit">
                    ACCESS CONTROL CENTER →
                </button>


            </form>


            <!-- BACK -->

            <a href="index.html"
               class="back-link">

                ← Back to NEXORA

            </a>


        </div>


    </main>


    <script src="admin-login.js"></script>

</body>

</html>
