<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nexora | Signup</title>

    <link rel="stylesheet" href="signup.css">
</head>

<body>

    <!-- Logo -->
    <header class="navbar">
        <div class="logo">
            NEX<span>O</span>RA
        </div>

        <a href="login.html" class="home-link">Login</a>
    </header>


    <!-- Signup Section -->
    <main class="signup-section">

        <div class="signup-card">

            <div class="welcome">
                WELCOME TO
            </div>

            <h1>
                NEXORA <span>SIGN UP</span>
            </h1>

            <p class="subtitle">
                Create your account and start your journey.
            </p>


            <form id="signupForm">

                <!-- Name -->
                <div class="input-group">

                    <label for="name">NAME</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="input-group">

                    <label for="email">EMAIL</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="input-group">

                    <label for="password">PASSWORD</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="eye-btn">
                            👁
                        </button>

                    </div>

                </div>


                <!-- Button -->
                <button
                    type="submit"
                    class="signup-btn">

                    CREATE ACCOUNT →

                </button>


                <!-- Message -->
                <p id="message"></p>

            </form>


            <p class="login-text">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </main>


    <script src="signup.js"></script>

</body>

</html>
