<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORRA | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at center, #063c75 0%, #021a35 40%, #020812 100%);
            overflow: hidden;
            color: white;
        }

        body::before {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            background: #008cff;
            filter: blur(180px);
            opacity: 0.25;
        }

        .login-box {
            position: relative;
            width: 470px;
            padding: 45px 55px;
            border-radius: 20px;

            background: rgba(5, 35, 65, 0.65);
            border: 1px solid rgba(0, 174, 255, 0.35);

            box-shadow:
                0 0 25px rgba(0, 153, 255, 0.25),
                inset 0 0 25px rgba(0, 153, 255, 0.08);

            backdrop-filter: blur(12px);
        }

        .welcome {
            text-align: center;
            color: #00eaff;
            font-size: 14px;
            letter-spacing: 4px;
            margin-bottom: 15px;
        }

        h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 12px;
        }

        h1 span {
            color: #00eaff;
            text-shadow: 0 0 15px #00eaff;
        }

        .subtitle {
            text-align: center;
            color: #a9c5d8;
            font-size: 14px;
            margin-bottom: 35px;
        }

        label {
            display: block;
            color: #00eaff;
            font-size: 12px;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 0 15px;
            margin-bottom: 22px;

            border: 1px solid rgba(0, 174, 255, 0.25);
            border-radius: 8px;

            background: rgba(0, 90, 160, 0.18);
            color: white;
            outline: none;

            transition: 0.3s;
        }

        input:focus {
            border-color: #00eaff;
            box-shadow: 0 0 15px rgba(0, 234, 255, 0.35);
        }

        input::placeholder {
            color: #6f9bb5;
        }

        button {
            width: 100%;
            height: 50px;

            border: none;
            border-radius: 8px;

            background: linear-gradient(90deg, #00a8ff, #00eaff);
            color: #02203b;

            font-size: 15px;
            font-weight: bold;
            cursor: pointer;

            box-shadow: 0 0 20px rgba(0, 200, 255, 0.35);
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 234, 255, 0.65);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .register {
            text-align: center;
            margin-top: 25px;
            color: #8ba9bb;
            font-size: 13px;
        }

        .register a {
            color: #00eaff;
            text-decoration: none;
            font-weight: bold;
        }

        .error {
            position: fixed;
            top: 35px;
            right: 40px;

            width: 360px;
            padding: 22px;

            border: 1px solid #ff633f;
            border-radius: 15px;

            background: rgba(35, 15, 25, 0.9);
            box-shadow: 0 0 20px rgba(255, 70, 40, 0.2);

            display: none;
        }

        .error-title {
            color: #ff694b;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 15px;
        }

        .error-text {
            color: #aaa;
            font-size: 13px;
        }

        .success {
            position: fixed;
            top: 35px;
            right: 40px;

            width: 360px;
            padding: 22px;

            border: 1px solid #00eaff;
            border-radius: 15px;

            background: rgba(5, 35, 65, 0.95);
            box-shadow: 0 0 20px rgba(0, 234, 255, 0.25);

            display: none;
        }

        .success-title {
            color: #00eaff;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 15px;
        }

        .success-text {
            color: #aaa;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .login-box {
                width: 90%;
                padding: 35px 25px;
            }

            .error,
            .success {
                right: 5%;
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="welcome">
            WELCOME BACK
        </div>

        <h1>
            NEXORRA <span>LOGIN</span>
        </h1>

        <p class="subtitle">
            Enter your account and continue your journey.
        </p>

        <form id="loginForm">

            <label>EMAIL</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label>PASSWORD</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit" id="loginButton">
                LOGIN
            </button>

        </form>

        <div class="register">
            Don't have an account?
            <a href="signup.html">Create Account</a>
        </div>

    </div>


    <!-- Error Popup -->

    <div class="error" id="errorBox">

        <div class="error-title">
            ⚠ &nbsp; LOGIN FAILED
        </div>

        <div class="error-text" id="errorText">
            Invalid email or password.
        </div>

    </div>


    <!-- Success Popup -->

    <div class="success" id="successBox">

        <div class="success-title">
            ✓ &nbsp; LOGIN SUCCESSFUL
        </div>

        <div class="success-text">
            Welcome back to Nexorra.
        </div>

    </div>


    <script>

        const loginForm = document.getElementById("loginForm");

        const emailInput = document.getElementById("email");

        const passwordInput = document.getElementById("password");

        const loginButton = document.getElementById("loginButton");

        const errorBox = document.getElementById("errorBox");

        const errorText = document.getElementById("errorText");

        const successBox = document.getElementById("successBox");


        loginForm.addEventListener("submit", async function(event) {

            event.preventDefault();


            const email = emailInput.value.trim();

            const password = passwordInput.value;


            // Hide previous messages

            errorBox.style.display = "none";

            successBox.style.display = "none";


            // Disable button while API is processing

            loginButton.disabled = true;

            loginButton.innerText = "LOGGING IN...";


            try {

                const response = await fetch(
                    "http://localhost:8080/api/auth/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );


                const result = await response.text();


                if (response.ok) {

                    successBox.style.display = "block";


                    // Wait 1 second and go to dashboard

                    setTimeout(function() {

                        window.location.href = "dashboard.html";

                    }, 1000);

                } else {

                    errorText.innerText =
                        result || "Invalid email or password.";

                    errorBox.style.display = "block";


                    setTimeout(function() {

                        errorBox.style.display = "none";

                    }, 3000);
                }


            } catch (error) {

                errorText.innerText =
                    "Cannot connect to server. Please start Spring Boot.";

                errorBox.style.display = "block";


                setTimeout(function() {

                    errorBox.style.display = "none";

                }, 4000);
            }


            // Enable button again

            loginButton.disabled = false;

            loginButton.innerText = "LOGIN";

        });

    </script>

</body>
</html>
